<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سينما فلوكس | CinemaFlux</title>
    <style>
        /* ===== المتغيرات الأساسية ===== */
        :root {
            --bg-main: #0b1116;
            --bg-surface: #06090c;
            --bg-card: #121b22;
            --border-color: #1c252d;
            --text-main: #ffffff;
            --text-sub: #9aa6b1;
            --accent: #e50914;
            --nav-bg: #06090c;
            --safe-top: 0px;
            --safe-bottom: 0px;
            --gold: #FFD700;
        }
        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --border-color: #dcdcdc;
            --text-main: #1a1a1a;
            --text-sub: #65676b;
            --accent: #e50914;
            --nav-bg: #ffffff;
            --gold: #D4A017;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        body { padding-bottom: calc(75px + var(--safe-bottom)); box-sizing: border-box; }

        /* ===== الهيدر واللوجو الاحترافي ===== */
        header {
            background-color: var(--bg-surface);
            padding: 15px;
            padding-top: calc(15px + var(--safe-top));
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: default;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-decoration: none;
            padding: 4px 0;
        }
        .logo-container:hover {
            transform: scale(1.04) rotate(-1deg);
        }
        .logo-container:hover .logo-c {
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.8), 0 0 60px rgba(255, 215, 0, 0.4);
        }
        .logo-container:hover .logo-glow-line {
            opacity: 1;
            width: 100%;
        }

        .logo-c {
            font-size: 48px;
            font-weight: 900;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #FFD700 48%, #E50914 52%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 8px rgba(229, 9, 20, 0.4));
            letter-spacing: -2px;
            transform: scaleX(1.05);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
            gap: 1px;
        }

        .logo-main {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #E50914, #FF4D6D, #E50914);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerGold 4s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
        }
        @keyframes shimmerGold {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-sub {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-sub);
            -webkit-text-fill-color: var(--text-sub);
            letter-spacing: 1.2px;
            opacity: 0.8;
            margin-right: 2px;
            transition: opacity 0.3s;
        }
        .logo-container:hover .logo-sub {
            opacity: 1;
        }

        .logo-glow-line {
            position: absolute;
            bottom: -4px;
            left: 0;
            height: 2.5px;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #E50914, #FFD700);
            background-size: 200% 100%;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.4s ease, width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: lineShimmer 2s linear infinite;
        }
        @keyframes lineShimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* ===== الحاوية العامة ===== */
        .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 12px; box-sizing: border-box; }

        /* ===== شريط التنقل السفلي ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background-color: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            text-decoration: none;
            gap: 4px;
            transition: transform 0.15s ease, color 0.15s ease;
        }
        .nav-item:active { transform: scale(0.88); }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }

        /* ===== واجهات التطبيق ===== */
        .app-view {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
        }
        .app-view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* ===== السلايدر العلوي ===== */
        .slider-container { margin: 15px 0; position: relative; width: 100%; }
        .featured-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .featured-slider::-webkit-scrollbar { display: none; }
        .slide-item {
            min-width: 85%;
            scroll-snap-align: start;
            position: relative;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .slide-item:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(229, 9, 20, 0.25); }
        .slide-item:active { transform: scale(0.98); }
        .slide-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .slide-details {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
        }
        .slide-title { font-size: 16px; font-weight: bold; margin: 0 0 5px 0; }
        .slide-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .slide-btn:hover {
            background-color: #ff0a1f;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
            transform: scale(1.08);
        }

        /* ===== تصنيفات وأسلاك الأفلام ===== */
        .row-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px 0; }
        .row-title {
            font-size: 16px;
            font-weight: bold;
            padding: 0 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .row-title:hover { color: var(--accent); transform: translateX(4px); }
        html[dir="rtl"] .row-title:hover { transform: translateX(-4px); }
        .row-title::after { content: " ❯"; font-size: 12px; opacity: 0.7; }
        html[dir="rtl"] .row-title { border-right: 4px solid var(--accent); }
        html[dir="ltr"] .row-title { border-left: 4px solid var(--accent); }
        html[dir="rtl"] .row-title::after { content: " ❮"; }

        .movies-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            width: 100%;
        }
        .movies-slider::-webkit-scrollbar { height: 4px; }
        .movies-slider::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }

        /* ===== بطاقة الفيلم ===== */
        .movie-card {
            min-width: 115px;
            max-width: 115px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            position: relative;
            overflow: visible;
        }
        .movie-card:hover { transform: scale(1.05); z-index: 2; }
        .movie-card:active { transform: scale(0.96); }

        .poster-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .poster-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(229, 9, 20, 0);
            transition: background 0.25s ease;
            border-radius: 8px;
            pointer-events: none;
        }
        .movie-card:hover .poster-wrapper::after {
            background: rgba(229, 9, 20, 0.12);
        }
        .poster-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 3;
        }
        .movie-card:hover .poster-play-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .movie-poster { width: 100%; height: 100%; object-fit: cover; }
        .movie-info { padding: 6px 0; }
        .movie-name { font-size: 12px; font-weight: bold; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-sub); }
        .movie-year-badge {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            display: inline-block;
            width: fit-content;
            margin-bottom: 3px;
        }
        .imdb-badge { background-color: var(--border-color); color: var(--text-main); padding: 1px 4px; border-radius: 3px; font-weight: bold; font-size: 10px; display: inline-block; width: fit-content; }

        /* ===== شبكة التصنيف الكامل ===== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        /* ===== البحث ===== */
        .search-container { padding: 15px 0; }
        .search-bar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 5px 15px;
            margin-bottom: 20px;
        }
        .search-bar-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            padding: 8px 5px;
            font-size: 14px;
            outline: none;
        }
        .voice-icon { font-size: 18px; color: var(--text-sub); cursor: pointer; margin: 0 5px; }
        .recent-searches-title { font-size: 15px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); }

        .search-list-vertical { display: flex; flex-direction: column; gap: 12px; }
        .search-item-row {
            display: flex;
            gap: 15px;
            background-color: var(--bg-surface);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .search-item-row:hover { background-color: var(--bg-card); transform: scale(1.01); border-color: var(--accent); }
        .search-item-poster { width: 65px; height: 95px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
        .search-item-details { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .search-item-title { font-size: 14px; font-weight: bold; margin: 0; }
        .search-item-meta { font-size: 12px; color: var(--text-sub); }
        .search-item-year { font-size: 11px; color: var(--text-sub); background-color: var(--bg-card); padding: 1px 8px; border-radius: 4px; border: 1px solid var(--border-color); display: inline-block; width: fit-content; }
        .remove-search-btn {
            position: absolute;
            top: 10px;
            font-size: 18px;
            color: #dc3545;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .remove-search-btn:hover { transform: scale(1.3); color: #ff0a1f; }
        html[dir="rtl"] .remove-search-btn { left: 15px; }
        html[dir="ltr"] .remove-search-btn { right: 15px; }

        .no-results { display: none; text-align: center; padding: 30px 15px; color: var(--text-sub); font-size: 13px; }

        /* ===== صفحة البروفايل ===== */
        .profile-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .profile-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .profile-subtitle { font-size: 12px; color: var(--text-sub); margin-bottom: 15px; }
        .profile-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .profile-btn:hover { opacity: 0.9; transform: scale(1.05); }

        .list-menu {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background-color: var(--bg-card); transform: translateX(4px); }
        html[dir="rtl"] .menu-item:hover { transform: translateX(-4px); }
        .menu-label { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .arrow-icon { color: var(--text-sub); font-size: 14px; font-weight: bold; }
        html[dir="rtl"] .arrow-icon::before { content: "‹"; font-size: 20px; }
        html[dir="ltr"] .arrow-icon::before { content: "›"; font-size: 20px; }

        .share-section { text-align: center; padding: 20px 0; }
        .share-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .share-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }

        .elena-credit { font-size: 11px; color: var(--text-sub); text-align: center; padding: 15px 0; font-style: italic; opacity: 0.7; letter-spacing: 0.5px; }

        /* ===== صفحة الفيلم المنفصلة ===== */
        .full-page-player { padding-top: 10px; }
        .back-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
        }
        .back-nav-btn:hover { transform: translateX(-4px) scale(1.05); color: var(--accent); }
        html[dir="rtl"] .back-nav-btn:hover { transform: translateX(4px) scale(1.05); }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .player-controls {
            display: flex;
            gap: 8px;
            padding: 12px;
            background-color: var(--bg-surface);
            justify-content: center;
            flex-wrap: wrap;
            border-radius: 0 0 12px 12px;
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .server-btn, .cast-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .server-btn:hover:not(.active) { background-color: var(--border-color); transform: scale(1.05); }
        .server-btn.active { background-color: var(--accent); border-color: var(--accent); color: #fff; }
        .server-btn.active:hover { background-color: #ff0a1f; transform: scale(1.05); }
        .cast-btn { background-color: #28a745; border-color: #28a745; color: #fff; }
        .cast-btn:hover { background-color: #2c9b4a; transform: scale(1.05) rotate(-1deg); box-shadow: 0 8px 25px rgba(40, 167, 69, 0.5); }

        .media-info-block { padding: 15px 0; }
        .media-title-row { font-size: 20px; font-weight: bold; margin: 0 0 5px 0; }
        .media-year-badge-detail {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }
        .media-meta-row { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .media-description { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }

        .cast-container { margin-top: 20px; }
        .cast-slider {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            width: 100%;
        }
        .cast-slider::-webkit-scrollbar { height: 4px; }
        .cast-slider::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }
        .cast-card { min-width: 70px; text-align: center; }
        .cast-avatar { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto; }
        .cast-name { font-size: 11px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75px; margin: 0 auto; }

        .comments-section { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .comments-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .comment-item { background-color: var(--bg-surface); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; }
        .comment-user { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .comment-text { font-size: 13px; color: var(--text-main); line-height: 1.5; margin: 0; word-break: break-word; }
        .comment-input-box { display: flex; gap: 10px; margin-top: 15px; }
        .comment-input-box input {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .comment-input-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2); transform: scale(1.02); }
        .comment-submit-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .comment-submit-btn:hover { background-color: #ff0a1f; transform: scale(1.05); box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4); }

        /* ===== نافذة تسجيل الدخول ===== */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .auth-box {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .auth-box h3 { margin-top: 0; font-size: 16px; margin-bottom: 15px; text-align: center; }
        .auth-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
        }
        .auth-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2); transform: scale(1.02); }
        .auth-box button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
