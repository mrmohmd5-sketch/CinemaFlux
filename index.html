                alert(currentLang === 'ar' ? "تم مسح سجل المشاهدة." : "Watch history cleared.");
            }
        }

        // ===== نظام العضوية =====
        function openAuthModal() {
            if (currentUser) {
                if (confirm(langPack[currentLang].logoutConfirm)) {
                    currentUser = null;
                    localStorage.removeItem('cf_user');
                    updateUserUI();
                    if (document.getElementById('viewHistory').classList.contains('active')) {
                        renderWatchHistoryUI();
                    }
                    alert(langPack[currentLang].logoutSuccess);
                }
            } else {
                authMode = 'login';
                setupAuthModalUI();
                document.getElementById('authModal').style.display = 'flex';
                document.getElementById('authModal').classList.add('active');
            }
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('authModal').classList.remove('active');
        }

        function toggleAuthMode() {
            authMode = (authMode === 'login') ? 'register' : 'login';
            setupAuthModalUI();
        }

        function setupAuthModalUI() {
            const isAr = (currentLang === 'ar');
            if (authMode === 'login') {
                document.getElementById('authModalTitle').innerText = isAr ? "تسجيل الدخول" : "Log In";
                document.getElementById('authPrimaryBtn').innerText = isAr ? "تسجيل الدخول" : "Log In";
                document.getElementById('authToggleText').innerText = isAr ? "ليس لديك حساب؟ إنشاء حساب جديد" :
                    "Don't have an account? Register new account";
            } else {
                document.getElementById('authModalTitle').innerText = isAr ? "إنشاء حساب جديد" : "Create New Account";
                document.getElementById('authPrimaryBtn').innerText = isAr ? "تأكيد التسجيل" : "Register";
                document.getElementById('authToggleText').innerText = isAr ? "لديك حساب بالفعل؟ سجل دخولك" :
                    "Already have an account? Log In";
            }
        }

        function handleAuthSubmit() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const isAr = (currentLang === 'ar');
            const dict = langPack[currentLang];

            if (!user || !pass) {
                alert(dict.emptyFields);
                return;
            }

            try {
                usersDB = JSON.parse(localStorage.getItem('cf_users')) || {};
            } catch (e) { usersDB = {}; }

            if (authMode === 'login') {
                if (usersDB[user] && usersDB[user] === pass) {
                    currentUser = { username: user };
                    try {
                        localStorage.setItem('cf_user', JSON.stringify(currentUser));
                    } catch (e) {}
                    alert(isAr ? `مرحباً بك مجدداً، ${user} ✨` : `Welcome back, ${user} ✨`);
                    closeAuthModal();
                    updateUserUI();
                    if (document.getElementById('viewHistory').classList.contains('active')) {
                        renderWatchHistoryUI();
                    }
                } else {
                    alert(dict.loginFail);
                }
            } else {
                if (usersDB[user]) {
                    alert(dict.userExists);
                    return;
                }
                if (pass.length < 6) {
                    alert(dict.passwordTooShort);
                    return;
                }
                usersDB[user] = pass;
                try {
                    localStorage.setItem('cf_users', JSON.stringify(usersDB));
                } catch (e) {}
                currentUser = { username: user };
                try {
                    localStorage.setItem('cf_user', JSON.stringify(currentUser));
                } catch (e) {}
                alert(dict.registerSuccess);
                closeAuthModal();
                updateUserUI();
                if (document.getElementById('viewHistory').classList.contains('active')) {
                    renderWatchHistoryUI();
                }
            }

            document.getElementById('authUsername').value = "";
            document.getElementById('authPassword').value = "";
        }

        function updateUserUI() {
            const dict = langPack[currentLang];
            const titleNode = document.getElementById('userDisplayTitle');
            const subNode = document.getElementById('userDisplaySubtitle');
            const btnNode = document.getElementById('authBtnAction');

            if (currentUser) {
                titleNode.innerText = currentUser.username;
                subNode.innerText = currentLang === 'ar' ? "عضو مميز في سينما فلوكس" : "Premium Member in CinemaFlux";
                btnNode.innerText = dict.btnLogout;
                btnNode.style.backgroundColor = "#dc3545";
                btnNode.style.color = "#fff";
            } else {
                titleNode.innerText = dict.userDefaultTitle;
                subNode.innerText = dict.userDefaultSub;
                btnNode.innerText = dict.btnLogin;
                btnNode.style.backgroundColor = "#fff";
                btnNode.style.color = "#000";
            }
        }

        function shareAppAction() {
            const shareText = currentLang === 'ar' ?
                "شاهد أحدث الأفلام والمسلسلات مجاناً وبأعلى جودة على سينما فلوكس CinemaFlux!" :
                "Watch latest movies and series for free in high quality on CinemaFlux!";
            if (navigator.share) {
                navigator.share({
                    title: 'CinemaFlux',
                    text: shareText,
                    url: window.location.href,
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(`${shareText} \n ${window.location.href}`);
                alert(currentLang === 'ar' ?
                    "تم نسخ رابط الموقع بنجاح، يمكنك مشاركته الآن مع أصدقائك!" :
                    "Website link copied successfully, you can share it now with your friends!");
            }
        }

        // ===== وظائف أندرويد =====
        function handleAndroidBack() {
            const authModal = document.getElementById('authModal');
            if (authModal.style.display === 'flex') {
                closeAuthModal();
                return 'handled';
            }
            const viewMovieDetail = document.getElementById('viewMovieDetail');
            if (viewMovieDetail.classList.contains('active')) {
                closeMoviePage();
                return 'handled';
            }
            const viewCategoryDetail = document.getElementById('viewCategoryDetail');
            if (viewCategoryDetail && viewCategoryDetail.classList.contains('active')) {
                closeCategoryPage();
                return 'handled';
            }
            const viewSettings = document.getElementById('viewSettings');
            const viewHistory = document.getElementById('viewHistory');
            if (viewSettings.classList.contains('active') || viewHistory.classList.contains('active')) {
                switchView('viewProfile');
                return 'handled';
            }
            const navSearch = document.getElementById('navSearch');
            const navProfile = document.getElementById('navProfile');
            const navAllMovies = document.getElementById('navAllMovies');
            const navAllSeries = document.getElementById('navAllSeries');
            if (navSearch.classList.contains('active') || navProfile.classList.contains('active') ||
                navAllMovies.classList.contains('active') || navAllSeries.classList.contains('active')) {
                switchNav('home');
                return 'handled';
            }
            const featuredView = document.getElementById('viewFeaturedMovies');
            const topMoviesView = document.getElementById('viewTopMovies');
            const topSeriesView = document.getElementById('viewTopSeries');
            if (featuredView && featuredView.classList.contains('active')) {
                closeListView('viewFeaturedMovies');
                return 'handled';
            }
            if (topMoviesView && topMoviesView.classList.contains('active')) {
                closeListView('viewTopMovies');
                return 'handled';
            }
            if (topSeriesView && topSeriesView.classList.contains('active')) {
                closeListView('viewTopSeries');
                return 'handled';
            }
            return 'default';
        }

        function setSafeAreas(top, bottom) {
            document.documentElement.style.setProperty('--safe-top', top + 'px');
            document.documentElement.style.setProperty('--safe-bottom', bottom + 'px');
        }

        // ===== الإعدادات واللغة والثيم =====
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('settingLangAr').classList.toggle('active', lang === 'ar');
            document.getElementById('settingLangEn').classList.toggle('active', lang === 'en');
            const htmlNode = document.getElementById('mainHtml');
            if (lang === 'ar') {
                htmlNode.setAttribute('dir', 'rtl');
                htmlNode.setAttribute('lang', 'ar');
            } else {
                htmlNode.setAttribute('dir', 'ltr');
                htmlNode.setAttribute('lang', 'en');
            }
            applyLocalization();
            applyHomeLocalization();
            renderHome();
            if (document.getElementById('viewHistory').classList.contains('active')) renderWatchHistoryUI();
            if (document.getElementById('viewAllMovies').classList.contains('active')) renderAllMoviesView();
            if (document.getElementById('viewAllSeries').classList.contains('active')) renderAllSeriesView();
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-theme', theme);
            document.getElementById('themeDarkBtn').classList.toggle('active', theme === 'dark');
            document.getElementById('themeLightBtn').classList.toggle('active', theme === 'light');
        }

        function applyLocalization() {
            const dict = langPack[currentLang];
            document.getElementById('txtNavHome').innerText = dict.navHome;
            document.getElementById('txtNavAllMovies').innerText = dict.navAllMovies;
            document.getElementById('txtNavAllSeries').innerText = dict.navAllSeries;
            document.getElementById('txtNavSearch').innerText = dict.navSearch;
            document.getElementById('txtNavProfile').innerText = dict.navProfile;
            document.getElementById('searchInput').placeholder = dict.searchPlaceholder;
            document.getElementById('txtRecentSearches').innerText = dict.recentSearches;
            document.getElementById('txtSearchResultsTitle').innerText = dict.searchResultsTitle;
            document.getElementById('noResultsMessage').innerText = dict.noResults;
            document.getElementById('txtMenuHistory').innerText = dict.watchHistoryTitle;
            document.getElementById('txtMenuSettings').innerText = dict.settingsTitle;
            document.getElementById('txtShareApp').innerText = dict.shareApp;
            document.getElementById('txtShareDesc').innerText = dict.shareDesc;
            document.getElementById('btnShareSubmit').innerText = dict.btnShare;
            document.getElementById('txtSettingClearSearch').innerText = dict.clearSearch;
            document.getElementById('txtBtnClearAllSearch').innerText = dict.clearAllBtn;
            document.getElementById('txtSettingLang').innerText = dict.settingLang;
            document.getElementById('txtSettingTheme').innerText = dict.settingTheme;
            document.getElementById('themeDarkBtn').innerText = dict.themeDark;
            document.getElementById('themeLightBtn').innerText = dict.themeLight;
            updateUserUI();
            document.getElementById('txtBackToProfile').innerText = dict.backToProfile;
            document.getElementById('txtSettingsTitlePage').innerText = dict.settingsTitlePage;
            document.getElementById('txtBackFromHistory').innerText = dict.backToProfile;
            document.getElementById('txtWatchHistoryTitlePage').innerText = dict.watchHistoryPageTitle;
            document.getElementById('txtClearWatchHistoryBtn').innerText = dict.clearAllBtn;
            document.getElementById('txtBackToMain').innerText = dict.backToMain;
            document.getElementById('txtBackToMainFromAllMovies').innerText = dict.backToMain;
            document.getElementById('txtBackToMainFromAllSeries').innerText = dict.backToMain;
            document.getElementById('txtBackToMainFromCat').innerText = dict.backToMain;
            document.getElementById('btnHD').innerText = dict.hdServer;
            document.getElementById('btnSD').innerText = dict.sdServer;
            document.getElementById('btnCast').innerText = dict.castBtn;
            document.getElementById('txtCastTitle').innerText = dict.castTitle;

            document.querySelectorAll('.lbl-watch-now').forEach(el => el.innerText = dict.watchNow);
            const select = document.getElementById('genreSelect');
            if (select) {
                const defaultOption = select.querySelector('option[value=""]');
                if (defaultOption) defaultOption.innerText = dict.genreSelectLabel;
            }
        }

        // ===== تأثير الـ Ripple العام =====
        function addGlobalRippleEffect() {
            const clickableElements = document.querySelectorAll(
                'button, .nav-item, .menu-item, .profile-btn, .slide-btn, .server-btn, .cast-btn, .back-nav-btn, .load-more-btn, .view-all-btn, .toggle-btn, .comment-submit-btn, .auth-toggle-link, .close-auth, .remove-search-btn, .movie-card, .search-item-row, .row-title, .voice-icon, .slide-item, .auth-box button, .cast-card'
                );
            clickableElements.forEach(el => {
                if (el.dataset.rippleAdded) return;
                el.dataset.rippleAdded = 'true';
                el.addEventListener('click', function(e) {
                    if (this.classList.contains('no-ripple')) return;
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple-effect-global';
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.style.position = 'absolute';
                    ripple.style.borderRadius = '50%';
                    ripple.style.background = 'rgba(255,255,255,0.2)';
                    ripple.style.transform = 'scale(0)';
                    ripple.style.animation = 'ripple-anim-global 0.6s ease-out forwards';
                    ripple.style.pointerEvents = 'none';
                    ripple.style.zIndex = '9999';
                    this.style.position = 'relative';
                    this.style.overflow = 'hidden';
                    this.appendChild(ripple);
                    setTimeout(() => {
                        if (ripple.parentNode) ripple.remove();
                    }, 700);
                });
            });
        }

        // ===== صفحة التصنيف الكامل =====
        function openCategoryPage(genreName, items) {
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            let catView = document.getElementById('viewCategoryDetail');
            if (!catView) {
                const container = document.getElementById('mainContainer');
                const newView = document.createElement('div');
                newView.id = 'viewCategoryDetail';
                newView.className = 'app-view';
                newView.innerHTML = `
                    <button class="back-nav-btn" onclick="closeCategoryPage()" type="button">➔ <span id="txtBackToMainFromCat">الرئيسية</span></button>
                    <div class="row-header">
                        <div class="row-title" id="currentCategoryTitle" style="cursor: default;">التصنيف</div>
                    </div>
                    <div class="category-grid" id="categoryGridItems"></div>
                `;
                container.appendChild(newView);
                catView = newView;
            }
            catView.classList.add('active');
            document.getElementById('currentCategoryTitle').innerText = genreName;
            const gridContainer = document.getElementById('categoryGridItems');
            gridContainer.innerHTML = '';
            items.forEach(item => {
                const card = createMovieCard(item);
                card.style.maxWidth = '100%';
                gridContainer.appendChild(card);
            });
            observeImages();
            scrollToTop();
        }

        function closeCategoryPage() {
            const catView = document.getElementById('viewCategoryDetail');
            if (catView) catView.classList.remove('active');
            if (lastViewBeforeMovie && lastViewBeforeMovie !== 'viewCategoryDetail') {
                if (lastViewBeforeMovie === 'home') switchNav('home');
                else if (lastViewBeforeMovie === 'allMovies') switchNav('allMovies');
                else if (lastViewBeforeMovie === 'allSeries') switchNav('allSeries');
                else if (lastViewBeforeMovie === 'search') switchNav('search');
                else if (lastViewBeforeMovie === 'profile') switchNav('profile');
                else switchNav('home');
            } else {
                switchNav('home');
            }
        }

        // إضافة style للريبل
        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes ripple-anim-global {
                to { transform: scale(4); opacity: 0; }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
