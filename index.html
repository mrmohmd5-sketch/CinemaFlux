<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سينما فلوكس | CinemaFlux</title>
    <style>
        /* ===== المتغيرات الأساسية ===== */
        :root {
            --bg-main: #0b1116;
            --bg-surface: #06090c;
            --bg-card: #121b22;
            --border-color: #1c252d;
            --text-main: #ffffff;
            --text-sub: #9aa6b1;
            --accent: #e50914;
            --nav-bg: #06090c;
            --safe-top: 0px;
            --safe-bottom: 0px;
            --gold: #FFD700;
        }
        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --border-color: #dcdcdc;
            --text-main: #1a1a1a;
            --text-sub: #65676b;
            --accent: #e50914;
            --nav-bg: #ffffff;
            --gold: #D4A017;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        body { padding-bottom: calc(75px + var(--safe-bottom)); box-sizing: border-box; }

        /* ===== الهيدر واللوجو الاحترافي ===== */
        header {
            background-color: var(--bg-surface);
            padding: 15px;
            padding-top: calc(15px + var(--safe-top));
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: default;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-decoration: none;
            padding: 4px 0;
        }
        .logo-container:hover {
            transform: scale(1.04) rotate(-1deg);
        }
        .logo-container:hover .logo-c {
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.8), 0 0 60px rgba(255, 215, 0, 0.4);
        }
        .logo-container:hover .logo-glow-line {
            opacity: 1;
            width: 100%;
        }

        .logo-c {
            font-size: 48px;
            font-weight: 900;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #FFD700 48%, #E50914 52%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 8px rgba(229, 9, 20, 0.4));
            letter-spacing: -2px;
            transform: scaleX(1.05);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
            gap: 1px;
        }

        .logo-main {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #E50914, #FF4D6D, #E50914);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerGold 4s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
        }
        @keyframes shimmerGold {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-sub {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-sub);
            -webkit-text-fill-color: var(--text-sub);
            letter-spacing: 1.2px;
            opacity: 0.8;
            margin-right: 2px;
            transition: opacity 0.3s;
        }
        .logo-container:hover .logo-sub {
            opacity: 1;
        }

        .logo-glow-line {
            position: absolute;
            bottom: -4px;
            left: 0;
            height: 2.5px;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #E50914, #FFD700);
            background-size: 200% 100%;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.4s ease, width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: lineShimmer 2s linear infinite;
        }
        @keyframes lineShimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* ===== حاوية الأزرار في الهيدر (زر التحميل والتصنيفات) ===== */
        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            margin-right: auto;
            align-items: flex-end;
        }
        html[dir="ltr"] .header-actions {
            margin-right: 0;
            margin-left: auto;
            align-items: flex-end;
        }

        /* ===== زر تحميل التطبيق ===== */
        .download-app-btn {
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 5px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.25);
            border: 1px solid var(--accent);
            width: fit-content;
        }
        .download-app-btn:hover {
            background-color: #ff0a1f;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
            transform: scale(1.05);
            color: #ffffff;
        }

        /* ===== القائمة المنسدلة للتصنيفات (المحدثة والاحترافية) ===== */
        .genre-select-wrapper {
            position: relative;
            display: inline-block;
            min-width: 140px;
            width: 100%;
        }
        
        .genre-select-wrapper::after {
            content: '▼';
            font-size: 10px;
            color: var(--text-sub);
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            transition: color 0.3s ease;
        }
        
        html[dir="ltr"] .genre-select-wrapper::after {
            left: auto;
            right: 14px;
        }

        .genre-select-wrapper:hover::after {
            color: var(--accent);
        }
        
        #genreSelect {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px 6px 32px; /* مسافة للسهم في اليمين/اليسار */
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        html[dir="ltr"] #genreSelect {
            padding: 6px 32px 6px 14px;
        }

        #genreSelect:hover, #genreSelect:focus {
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.25);
            background-color: var(--bg-surface);
        }
        
        #genreSelect option {
            background-color: var(--bg-card);
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
        }
        
        /* تجميل شريط التمرير داخل القائمة المنسدلة */
        #genreSelect::-webkit-scrollbar {
            width: 6px;
        }
        #genreSelect::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border-radius: 10px;
        }

        /* ===== الحاوية العامة ===== */
        .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 12px; box-sizing: border-box; }

        /* ===== شريط التنقل السفلي ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background-color: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 11px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            text-decoration: none;
            gap: 4px;
            transition: transform 0.15s ease, color 0.15s ease;
        }
        .nav-item:active { transform: scale(0.88); }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }

        /* ===== واجهات التطبيق ===== */
        .app-view {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
        }
        .app-view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* ===== السلايدر العلوي ===== */
        .slider-container { margin: 15px 0; position: relative; width: 100%; }
        .featured-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .featured-slider::-webkit-scrollbar { display: none; }
        .slide-item {
            min-width: 85%;
            scroll-snap-align: start;
            position: relative;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .slide-item:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(229, 9, 20, 0.25); }
        .slide-item:active { transform: scale(0.98); }
        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.6);
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .slide-img.loaded {
            opacity: 1;
        }
        .slide-details {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
        }
        .slide-title { font-size: 16px; font-weight: bold; margin: 0 0 5px 0; }
        .slide-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .slide-btn:hover {
            background-color: #ff0a1f;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
            transform: scale(1.08);
        }

        /* ===== تصنيفات وأسلاك الأفلام ===== */
        .row-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px 0; }
        .row-title {
            font-size: 16px;
            font-weight: bold;
            padding: 0 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .row-title:hover { color: var(--accent); transform: translateX(4px); }
        html[dir="rtl"] .row-title:hover { transform: translateX(-4px); }
        .row-title::after { content: " ❯"; font-size: 12px; opacity: 0.7; }
        html[dir="rtl"] .row-title::after { content: " ❮"; }
        html[dir="rtl"] .row-title { border-right: 4px solid var(--accent); }
        html[dir="ltr"] .row-title { border-left: 4px solid var(--accent); }

        .movies-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            width: 100%;
        }
        .movies-slider::-webkit-scrollbar { height: 4px; }
        .movies-slider::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }

        /* ===== بطاقة الفيلم ===== */
        .movie-card {
            min-width: 115px;
            max-width: 115px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            position: relative;
            overflow: visible;
        }
        .movie-card:hover { transform: scale(1.05); z-index: 2; }
        .movie-card:active { transform: scale(0.96); }

        .poster-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .poster-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(229, 9, 20, 0);
            transition: background 0.25s ease;
            border-radius: 8px;
            pointer-events: none;
        }
        .movie-card:hover .poster-wrapper::after {
            background: rgba(229, 9, 20, 0.12);
        }
        .poster-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 3;
        }
        .movie-card:hover .poster-play-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .movie-poster { width: 100%; height: 100%; object-fit: cover; }
        .movie-info { padding: 6px 0; }
        .movie-name { font-size: 12px; font-weight: bold; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-sub); }
        .imdb-badge { background-color: var(--border-color); color: var(--text-main); padding: 1px 4px; border-radius: 3px; font-weight: bold; font-size: 10px; display: inline-block; width: fit-content; }

        /* ===== شبكة التصنيف الكامل ===== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        /* شبكة مدمجة للقوائم الكاملة */
        .compact-grid {
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }

        /* ===== البحث ===== */
        .search-container { padding: 15px 0; }
        .search-bar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 5px 15px;
            margin-bottom: 20px;
        }
        .search-bar-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            padding: 8px 5px;
            font-size: 14px;
            outline: none;
        }
        .voice-icon { font-size: 18px; color: var(--text-sub); cursor: pointer; margin: 0 5px; }
        .recent-searches-title { font-size: 15px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); }

        .search-list-vertical { display: flex; flex-direction: column; gap: 12px; }
        .search-item-row {
            display: flex;
            gap: 15px;
            background-color: var(--bg-surface);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .search-item-row:hover { background-color: var(--bg-card); transform: scale(1.01); border-color: var(--accent); }
        .search-item-poster { 
            width: 65px; 
            height: 95px; 
            object-fit: cover; 
            border-radius: 6px; 
            border: 1px solid var(--border-color);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .search-item-poster.loaded {
            opacity: 1;
        }
        .search-item-details { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .search-item-title { font-size: 14px; font-weight: bold; margin: 0; }
        .search-item-meta { font-size: 12px; color: var(--text-sub); }
        .remove-search-btn {
            position: absolute;
            top: 10px;
            font-size: 18px;
            color: #dc3545;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .remove-search-btn:hover { transform: scale(1.3); color: #ff0a1f; }
        html[dir="rtl"] .remove-search-btn { left: 15px; }
        html[dir="ltr"] .remove-search-btn { right: 15px; }

        .no-results { display: none; text-align: center; padding: 30px 15px; color: var(--text-sub); font-size: 13px; }

        /* ===== صفحة البروفايل ===== */
        .profile-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .profile-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .profile-subtitle { font-size: 12px; color: var(--text-sub); margin-bottom: 15px; }
        .profile-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .profile-btn:hover { opacity: 0.9; transform: scale(1.05); }

        .list-menu {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background-color: var(--bg-card); transform: translateX(4px); }
        html[dir="rtl"] .menu-item:hover { transform: translateX(-4px); }
        .menu-label { font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .arrow-icon { color: var(--text-sub); font-size: 14px; font-weight: bold; }
        html[dir="rtl"] .arrow-icon::before { content: "‹"; font-size: 20px; }
        html[dir="ltr"] .arrow-icon::before { content: "›"; font-size: 20px; }

        .share-section { text-align: center; padding: 20px 0; }
        .share-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .share-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }

        .elena-credit { font-size: 11px; color: var(--text-sub); text-align: center; padding: 15px 0; font-style: italic; opacity: 0.7; letter-spacing: 0.5px; }

        /* ===== صفحة الفيلم المنفصلة ===== */
        .full-page-player { padding-top: 10px; }
        .back-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
        }
        .back-nav-btn:hover { transform: translateX(-4px) scale(1.05); color: var(--accent); }
        html[dir="rtl"] .back-nav-btn:hover { transform: translateX(4px) scale(1.05); }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .player-controls {
            display: flex;
            gap: 8px;
            padding: 12px;
            background-color: var(--bg-surface);
            justify-content: center;
            flex-wrap: wrap;
            border-radius: 0 0 12px 12px;
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .server-btn, .cast-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .server-btn:hover:not(.active) { background-color: var(--border-color); transform: scale(1.05); }
        .server-btn.active { background-color: var(--accent); border-color: var(--accent); color: #fff; }
        .server-btn.active:hover { background-color: #ff0a1f; transform: scale(1.05); }
        .cast-btn { background-color: #28a745; border-color: #28a745; color: #fff; }
        .cast-btn:hover { background-color: #2c9b4a; transform: scale(1.05) rotate(-1deg); box-shadow: 0 8px 25px rgba(40, 167, 69, 0.5); }

        .media-info-block { padding: 15px 0; }
        .media-title-row { font-size: 20px; font-weight: bold; margin: 0 0 5px 0; }
        .media-meta-row { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
        .media-description { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; }

        /* ===== حاوية الإعلان (YouTube Ad) ===== */
        #adContainer {
            margin: 15px 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
            position: relative;
        }
        #adContainer iframe,
        #adContainer img {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        #adContainer .ad-placeholder {

        // ===== دالة لمراقبة تحميل الصور باستخدام IntersectionObserver =====
        function observeImages() {
            if (imagesObserved) return;
            imagesObserved = true;

            const images = document.querySelectorAll('.movie-poster, .search-item-poster, .cast-avatar, .slide-img');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.classList.add('loaded');
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '50px' });
            images.forEach(img => {
                if (img.complete && img.naturalWidth > 0) {
                    img.classList.add('loaded');
                } else {
                    observer.observe(img);
                }
            });
        }

        // ===== وظائف الصفحة الرئيسية الجديدة =====

        // جلب التقييم الخاص بالفيلم (من userScores أو من rating)
        function getMovieScore(item) {
            if (userScores[item.title] !== undefined) {
                return parseFloat(userScores[item.title]) || 0;
            }
            return parseFloat(item.rating) || 0;
        }

        // جلب الأفلام المميزة (تعتمد على خاصية featured في البيانات أولاً)
        function getFeaturedMovies() {
            // البحث عن العناصر التي تحمل featured: true
            const featuredFromData = allMoviesData.filter(item => item.featured === true);
            if (featuredFromData.length > 0) {
                return featuredFromData;
            }
            // خيار احتياطي باستخدام localStorage (للتوافق مع الإصدارات السابقة)
            return allMoviesData.filter(item => featuredMoviesList.includes(item.title));
        }

        // ترتيب الأفلام حسب التقييم تنازلياً
        function sortByScore(items) {
            return [...items].sort((a, b) => getMovieScore(b) - getMovieScore(a));
        }

        // عرض السلايدر العلوي (الأفلام المميزة)
        function renderFeaturedSlider() {
            const slider = document.getElementById('featuredSlider');
            if (!slider) return;
            slider.innerHTML = '';

            let featured = getFeaturedMovies();
            // إذا لم توجد أفلام مميزة، نعرض أفضل 5 أفلام تقيماً
            if (featured.length === 0) {
                featured = sortByScore(allMoviesData).slice(0, 5);
            }

            featured.forEach(item => {
                const slide = document.createElement('div');
                slide.className = 'slide-item';
                slide.innerHTML = `
                    <img class="slide-img" src="${item.poster}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'" alt="${item.title}">
                    <div class="slide-details">
                        <div class="slide-title">${item.title}</div>
                        <button class="slide-btn">▶ <span class="lbl-watch-now">${langPack[currentLang].watchNow}</span></button>
                    </div>
                `;
                const img = slide.querySelector('.slide-img');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            img.classList.add('loaded');
                            observer.disconnect();
                        }
                    });
                }, { rootMargin: '50px' });
                if (img.complete && img.naturalWidth > 0) {
                    img.classList.add('loaded');
                } else {
                    observer.observe(img);
                }
                slide.onclick = () => openMoviePage(item);
                slider.appendChild(slide);
            });
        }

        // دالة عامة لفتح صفحة قائمة كاملة (شبكة)
        function openListView(viewId, gridId, dataProvider, titleId, defaultTitle) {
            // إخفاء جميع الصفحات
            document.querySelectorAll('.app-view').forEach(el => el.classList.remove('active'));
            const targetView = document.getElementById(viewId);
            if (!targetView) return;
            targetView.classList.add('active');

            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = '';

            const items = typeof dataProvider === 'function' ? dataProvider() : dataProvider;
            if (items.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-sub);">${currentLang === 'ar' ? 'لا توجد عناصر لعرضها' : 'No items to display'}</div>`;
                return;
            }

            items.forEach(item => {
                const card = createMovieCard(item);
                card.style.maxWidth = '100%';
                grid.appendChild(card);
            });
            observeImages();

            // ترجمة العنوان
            const titleEl = document.getElementById(titleId);
            if (titleEl) {
                const dict = langPack[currentLang];
                // نستخدم الترجمة من القاموس إن وجدت

                else if (viewId === 'viewTopMovies') titleEl.innerText = dict.top100Movies;
                else if (viewId === 'viewTopSeries') titleEl.innerText = dict.topSeries;
                else titleEl.innerText = defaultTitle;

        }

        // دالة لإغلاق صفحة القائمة والعودة للرئيسية
        function closeListView(viewId) {
            document.getElementById(viewId).classList.remove('active');

        // ===== دالة استخراج التصنيفات (معدلة) =====
        function getUniqueGenres() {
            const genresSet = new Set();
            allMoviesData.forEach(item => {
                if (item.genre) {
                    // تقسيم على الفواصل (، و,) مع الاحتفاظ بالمسافات
                    const parts = item.genre.split(/[\s,،]+/).filter(part => part.trim().length > 0);
                    parts.forEach(part => {
                        let clean = part.trim();
                        // استبعاد التصنيفات المطلوب حذفها
                        if (clean === 'وفانتازيا' || clean === 'ومغامرة' || clean === 'فيلم' || clean === 'تلفازي') {
                            return;
                        }
                        // دمج خيال وعلمي
                        if (clean.includes('خيال') || clean.includes('علمي')) {
                            clean = 'خيال علمي';
                        } else if (clean.includes('رسوم') || clean.includes('متحركة')) {
                            clean = 'رسوم متحركة';
                        }
                        genresSet.add(clean);
                    });
                }
            });
            return Array.from(genresSet);
        }

        // ===== تعبئة القائمة المنسدلة للتصنيفات =====
        function populateGenreDropdown() {
            const select = document.getElementById('genreSelect');
            if (!select) return;

            const uniqueGenres = getUniqueGenres();
            // نرتب القائمة أبجدياً
            uniqueGenres.sort((a, b) => a.localeCompare(b));

            // بناء الخيارات
            select.innerHTML = `<option value="">${langPack[currentLang].genreSelectLabel}</option>`;
            uniqueGenres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });

            // إضافة خيار خاص لـ "مدبلج" (يبحث في العنوان)
            const optDub = document.createElement('option');
            optDub.value = 'مدبلج';
            optDub.textContent = 'مدبلج';
            select.appendChild(optDub);

            // معالج التغيير
            select.onchange = function() {
                const selected = this.value;
                const resultsContainer = document.getElementById('genreResultsContainer');
                const grid = document.getElementById('genreResultsGrid');
                const title = document.getElementById('genreResultsTitle');

                if (!selected) {
                    resultsContainer.style.display = 'none';
                    document.getElementById('featuredMoviesSection').style.display = 'block';
                    document.getElementById('topMoviesSection').style.display = 'block';
                    document.getElementById('topSeriesSection').style.display = 'block';
                    return;
                }

                // إخفاء الأقسام الأخرى
                document.getElementById('featuredMoviesSection').style.display = 'none';
                document.getElementById('topMoviesSection').style.display = 'none';
                document.getElementById('topSeriesSection').style.display = 'none';

                // تصفية المحتوى
                let filtered = [];
                if (selected === 'خيال علمي') {
                    filtered = allMoviesData.filter(item => {
                        if (!item.genre) return false;
                        return item.genre.includes('خيال') || item.genre.includes('علمي');
                    });
                } else if (selected === 'رسوم متحركة') {
                    filtered = allMoviesData.filter(item => {
                        if (!item.genre) return false;
                        return item.genre.includes('رسوم') || item.genre.includes('متحركة');
                    });
                } else if (selected === 'مدبلج') {
                    filtered = allMoviesData.filter(item => item.title.includes('مدبلج'));
                } else {
                    filtered = allMoviesData.filter(item => item.genre && item.genre.includes(selected));
                }

                // عرض النتائج
                title.innerText = `${langPack[currentLang].genreResultsTitle}: ${selected}`;
                grid.innerHTML = '';
                if (filtered.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-sub);">${currentLang === 'ar' ? 'لا توجد نتائج لهذا التصنيف' : 'No results for this genre'}</div>`;
                } else {
                    filtered.forEach(item => {
                        const card = createMovieCard(item);
                        card.style.maxWidth = '100%';
                        grid.appendChild(card);
                    });
                }
                resultsContainer.style.display = 'block';
                observeImages();
                scrollToTop();
            };

            // إعادة تعيين القيمة الافتراضية (فارغة)
            select.value = '';
            // إظهار الـ select
            select.style.display = 'block';
        }

        // ===== دالة إنشاء بطاقة فيلم (مكررة) =====
        function createMovieCard(item) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            const ratingText = item.rating ? `⭐ ${item.rating} IMDb` : '⭐ N/A IMDb';
            card.innerHTML = `
                <div class="poster-wrapper">
                    <img class="movie-poster" src="${item.poster}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'" loading="lazy" decoding="async" fetchpriority="low">
                    <div class="poster-play-icon">▶</div>
                </div>
                <div class="movie-info">
                    <p class="movie-name">${item.title}</p>
                    <div class="movie-meta">
                        <span class="imdb-badge">${ratingText}</span>
                        <span style="font-size:10px; margin-top:2px;">${item.year || ''}</span>
                    </div>
                </div>
            `;
            const img = card.querySelector('.movie-poster');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        img.classList.add('loaded');
                        observer.disconnect();
                    }
                });
            }, { rootMargin: '50px' });
            if (img.complete && img.naturalWidth > 0) {
                img.classList.add('loaded');
            } else {
                observer.observe(img);
            }

            card.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                const rect = card.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
                card.querySelector('.poster-wrapper').appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
                openMoviePage(item);
            });
            return card;
        }

        // ===== دوال البحث =====
        function handleSearchSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const historyBlock = document.getElementById('searchHistoryBlock');
            const resultsBlock = document.getElementById('searchResultsBlock');
            const resultsList = document.getElementById('searchResultsList');
            const noResults = document.getElementById('noResultsMessage');

            if (!query) {
                resultsBlock.style.display = 'none';
                historyBlock.style.display = 'block';
                noResults.style.display = 'none';
                return;
            }

            historyBlock.style.display = 'none';
            const matches = allMoviesData.filter(item => {
                if (item.title.toLowerCase().includes(query)) return true;
                if (item.genre && item.genre.toLowerCase().includes(query)) return true;
                if (item.desc && item.desc.toLowerCase().includes(query)) return true;
                if (item.cast && item.cast.some(c => c.name && c.name.toLowerCase().includes(query))) return true;
                return false;
            });

            resultsList.innerHTML = '';
            if (matches.length === 0) {
                resultsBlock.style.display = 'none';
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
                resultsBlock.style.display = 'block';
                matches.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'search-item-row';
                    const ratingText = item.rating ? `⭐ ${item.rating} IMDb` : '⭐ N/A IMDb';
                    row.innerHTML = `
                        <img class="search-item-poster" src="${item.poster}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'" loading="lazy" decoding="async" fetchpriority="low">
                        <div class="search-item-details">
                            <h4 class="search-item-title">${item.title}</h4>
                            <div class="search-item-meta">${item.year || ''} • ${ratingText}</div>
                        </div>
                    `;
                    const img = row.querySelector('.search-item-poster');
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                img.classList.add('loaded');
                                observer.disconnect();
                            }
                        });
                    }, { rootMargin: '50px' });
                    if (img.complete && img.naturalWidth > 0) {
                        img.classList.add('loaded');
                    } else {
                        observer.observe(img);
                    }
                    row.onclick = () => {
                        saveToSearchHistory(item.title);
                        openMoviePage(item);
                    };
                    resultsList.appendChild(row);
                });
            }
        }

        function saveToSearchHistory(term) {
            searchHistory = searchHistory.filter(x => x !== term);
            searchHistory.unshift(term);
            if(searchHistory.length > 10) searchHistory.pop();
            try {
                localStorage.setItem('cf_search_history', JSON.stringify(searchHistory));
            } catch(e) {}
        }

            if(searchHistory.length === 0) {
                document.getElementById('searchHistoryBlock').style.display = 'none';
                return;
            }

            document.getElementById('searchHistoryBlock').style.display = 'block';
            searchHistory.forEach((term, index) => {
                const matchedItem = allMoviesData.find(x => x.title.toLowerCase() === term.toLowerCase());
                const row = document.createElement('div');
                row.className = 'search-item-row';

                if (matchedItem) {
                    const ratingText = matchedItem.rating ? `⭐ ${matchedItem.rating} IMDb` : '⭐ N/A IMDb';
                    row.innerHTML = `
                        <img class="search-item-poster" src="${matchedItem.poster}" loading="lazy" decoding="async" fetchpriority="low">

                    `;

                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                img.classList.add('loaded');
                                observer.disconnect();
                            }
                        });
                    }, { rootMargin: '50px' });
                    if (img.complete && img.naturalWidth > 0) {

            renderSearchHistoryUI();

        // ===== سجل المشاهدة =====
        function addToWatchHistory(item) {
            if (!currentUser) return;
            const username = currentUser.username;
            if (!userWatchHistories[username]) {
                userWatchHistories[username] = [];
            }
            let history = userWatchHistories[username];
            history = history.filter(x => x.title !== item.title);
            history.unshift({
                title: item.title,
                poster: item.poster,
                year: item.year,
                rating: item.rating,
                timestamp: Date.now()
            });
            if (history.length > 20) history.pop();
            userWatchHistories[username] = history;
            try {
                localStorage.setItem('cf_user_watch_histories', JSON.stringify(userWatchHistories));
            } catch(e) {}
        }

            const listContainer = document.getElementById('fullWatchHistoryList');

            if (history.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-sub); font-size:13px;">${dict.historyEmpty}</div>`;
                return;
            }
            history.forEach((hist) => {
                const ratingText = hist.rating ? `⭐ ${hist.rating} IMDb` : '⭐ N/A IMDb';
                const row = document.createElement('div');
                row.className = 'search-item-row';
                row.innerHTML = `
                    <img class="search-item-poster" src="${hist.poster}" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'" loading="lazy" decoding="async" fetchpriority="low">
                    <div class="search-item-details">
                        <h4 class="search-item-title">${hist.title}</h4>
                        <div class="search-item-meta">${hist.year || ''} • ${ratingText}</div>
                    </div>
                `;
                const img = row.querySelector('.search-item-poster');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            img.classList.add('loaded');
                            observer.disconnect();
                        }
                    });
                }, { rootMargin: '50px' });
                if (img.complete && img.naturalWidth > 0) {
                    img.classList.add('loaded');
                } else {
                    observer.observe(img);
                }
                row.onclick = () => {
                    const originalItem = allMoviesData.find(x => x.title === hist.title);
                    if(originalItem) openMoviePage(originalItem);
                };
                listContainer.appendChild(row);
            });

            if (decodedUrlStr.includes('<iframe')) {

        function getSimilarMovies(currentItem, limit = 10) {
            if (!currentItem) return [];
            const all = allMoviesData.filter(item => item.title !== currentItem.title);
            const scored = all.map(item => {
                let score = 0;
                if (item.genre && currentItem.genre) {
                    const g1 = item.genre.split(/[\s,،]+/).filter(Boolean);
                    const g2 = currentItem.genre.split(/[\s,،]+/).filter(Boolean);
                    const common = g1.filter(g => g2.includes(g)).length;
                    const total = Math.max(g1.length, g2.length);
                    score += total > 0 ? (common / total) * 0.5 : 0;
                }
                if (item.desc && currentItem.desc) {
                    const words1 = item.desc.toLowerCase().split(/\s+/).filter(w => w.length > 2);
                    const words2 = currentItem.desc.toLowerCase().split(/\s+/).filter(w => w.length > 2);
                    const common = words1.filter(w => words2.includes(w)).length;
                    const total = Math.max(words1.length, words2.length);
                    score += total > 0 ? (common / total) * 0.3 : 0;
                }
                const r1 = parseFloat(item.rating) || 0;
                const r2 = parseFloat(currentItem.rating) || 0;
                const diff = Math.abs(r1 - r2);
                score += Math.max(0, (1 - diff / 10)) * 0.2;
                return { item, score };
            });
            scored.sort((a, b) => b.score - a.score);
            return scored.slice(0, limit).map(s => s.item);
        }

        // ===== تأثير الـ Ripple =====
        function addGlobalRippleEffect() {
            const clickableElements = document.querySelectorAll('button, .nav-item, .menu-item, .profile-btn, .slide-btn, .server-btn, .cast-btn, .back-nav-btn, .load-more-btn, .view-all-btn, .toggle-btn, .comment-submit-btn, .auth-toggle-link, .close-auth, .remove-search-btn, .movie-card, .search-item-row, .row-title, .voice-icon, .slide-item, .auth-box button, .cast-card');
            clickableElements.forEach(el => {
                if (el.dataset.rippleAdded) return;
                el.dataset.rippleAdded = 'true';
                el.addEventListener('click', function(e) {
                    if (this.classList.contains('no-ripple')) return;
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple-effect-global';
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.style.position = 'absolute';
                    ripple.style.borderRadius = '50%';
                    ripple.style.background = 'rgba(255,255,255,0.3)';
                    ripple.style.transform = 'scale(0)';
                    ripple.style.animation = 'ripple-anim-global 0.6s ease-out forwards';
                    ripple.style.pointerEvents = 'none';
                    ripple.style.zIndex = '9999';
                    this.style.position = 'relative';
                    this.style.overflow = 'hidden';
                    this.appendChild(ripple);
                    setTimeout(() => {
                        if (ripple.parentNode) ripple.remove();
                    }, 700);
                });
            });
        }

        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes ripple-anim-global {
                to { transform: scale(4); opacity: 0; }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
